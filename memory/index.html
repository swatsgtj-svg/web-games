<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホの画面幅に合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>神経衰弱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- 一覧ページに戻るリンク。「../」は「1つ上のフォルダ」という意味 -->
    <a class="home-link" href="../index.html">← ゲーム一覧</a>
    <h1>神経衰弱</h1>

    <!-- ① 難易度とテーマをえらぶ画面 -->
    <section id="screen-select" class="screen screen-select">
      <h2 class="section-title">難易度</h2>
      <!-- data-level の値で、どの難易度のボタンかを JavaScript が見分ける -->
      <div class="choice-list" id="level-list">
        <button type="button" class="choice" data-level="easy" aria-pressed="true">
          <span class="choice-name">やさしい</span>
          <span class="choice-sub">6枚</span>
          <span class="choice-best" data-best="easy">記録なし</span>
        </button>
        <button type="button" class="choice" data-level="normal" aria-pressed="false">
          <span class="choice-name">ふつう</span>
          <span class="choice-sub">12枚</span>
          <span class="choice-best" data-best="normal">記録なし</span>
        </button>
        <button type="button" class="choice" data-level="hard" aria-pressed="false">
          <span class="choice-name">むずかしい</span>
          <span class="choice-sub">20枚</span>
          <span class="choice-best" data-best="hard">記録なし</span>
        </button>
      </div>

      <h2 class="section-title">絵柄</h2>
      <div class="choice-list theme-list" id="theme-list">
        <button type="button" class="choice" data-theme="animal" aria-pressed="true">
          <span class="choice-icon" aria-hidden="true">🐶</span>
          <span class="choice-name">動物</span>
        </button>
        <button type="button" class="choice" data-theme="vehicle" aria-pressed="false">
          <span class="choice-icon" aria-hidden="true">🚗</span>
          <span class="choice-name">乗り物</span>
        </button>
        <button type="button" class="choice" data-theme="food" aria-pressed="false">
          <span class="choice-icon" aria-hidden="true">🍎</span>
          <span class="choice-name">食べもの</span>
        </button>
        <button type="button" class="choice" data-theme="original" aria-pressed="false">
          <span class="choice-icon" aria-hidden="true">📷</span>
          <span class="choice-name">オリジナル</span>
        </button>
      </div>

      <!-- オリジナルを選んだときだけ出す、写真えらびの場所 -->
      <div class="photo-panel" id="photo-panel" hidden>
        <!-- 本物のファイル選択は見えなくして、label をボタンのように見せる -->
        <label class="photo-add">
          ＋ 写真をえらぶ
          <input type="file" id="photo-input" accept="image/*" multiple>
        </label>
        <p class="photo-count" id="photo-count" aria-live="polite"></p>
        <ul class="photo-list" id="photo-list"></ul>
        <button type="button" class="text-button" id="photo-clear" hidden>写真をぜんぶ消す</button>
        <p class="photo-note">写真はこのブラウザの中だけに保存されます。どこにも送られません。</p>
      </div>

      <button type="button" class="primary start-button" id="start-button">スタート</button>
      <p class="howto">📱 カードをタップ／💻 クリック、または矢印キーでえらんで Enter</p>
    </section>

    <!-- ② あそぶ画面（最初はかくしておく） -->
    <section id="screen-play" class="screen screen-play" hidden>
      <dl class="status">
        <div><dt>間違い</dt><dd id="miss">0</dd></div>
        <div><dt>そろった</dt><dd id="pairs">0/3</dd></div>
        <div><dt>ベスト</dt><dd id="best">-</dd></div>
      </dl>
      <!-- ここに JavaScript がカードを並べる -->
      <div class="board-area" id="board-area">
        <div class="board" id="board"></div>
      </div>
      <button type="button" class="text-button quit-button" id="quit-button">やめる</button>
    </section>

    <!-- ③ クリア画面（最初はかくしておく） -->
    <section id="screen-clear" class="screen screen-clear" hidden>
      <p class="clear-title">🎉 クリア！</p>
      <p class="final-score">間違い <span id="final-miss">0</span> 回</p>
      <p id="new-record" class="new-record" hidden>ハイスコア更新！</p>
      <button type="button" class="primary" id="retry-button">もう一回</button>
      <button type="button" class="secondary" id="back-button">難易度・絵柄をえらぶ</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
